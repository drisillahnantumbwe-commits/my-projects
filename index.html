<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Web Calculator Interface Design</title>
</head>
<link rel="stylesheet" href="style.css">

<body>
  <div class="calculator">
    
    <div id="display">
      <div id="xy">0</div>
    </div>
    <div class="buttons">
      <button class="ac">AC</button>
      <button>00</button>
      <button>%</button>
      <button class="bt">÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="bt">*</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="bt">-</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="bt">+</button>

      <button class="f">0</button>
      <button>.</button>
      <button class="bt">=</button>
    </div>
  </div>

</body>

</html>
